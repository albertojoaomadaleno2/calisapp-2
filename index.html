<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CalisApp PRO V2</title>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --black: #0a0a0a; --white: #f5f0e8; --accent: #e8ff47; --gray: #888; --card: #141414; --success: #2ecc71; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; }
  header { padding: 50px 25px 20px; }
  .title-main { font-family: 'Bebas Neue', sans-serif; font-size: 50px; line-height: 0.9; }
  .weeks-nav { display: flex; gap: 10px; padding: 20px 25px; overflow-x: auto; scrollbar-width: none; }
  .week-btn { padding: 10px 20px; border: 1px solid #222; border-radius: 30px; color: var(--gray); white-space: nowrap; font-weight: 600; }
  .week-btn.active { background: var(--accent); color: var(--black); border-color: var(--accent); }
  .week-content { display: none; padding: 0 25px 50px; }
  .week-content.active { display: block; }
  .session-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; margin: 30px 0 15px; color: var(--gray); border-left: 3px solid var(--accent); padding-left: 12px; }
  .exercise-item { background: var(--card); border-radius: 15px; padding: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; border: 1px solid transparent; }
  .exercise-item.done { opacity: 0.4; border-color: var(--success); }
  .ex-check { width: 25px; height: 25px; border: 2px solid var(--accent); border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .exercise-item.done .ex-check { background: var(--success); border-color: var(--success); color: var(--black); }
  .exercise-item.done .ex-check::after { content: '✓'; }
  .ex-info { flex: 1; }
  .ex-name { font-weight: 700; font-size: 15px; }
  .ex-sets { color: var(--accent); font-size: 12px; font-weight: 600; }
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 1000; display: none; flex-direction: column; padding: 40px 25px; }
  .modal.open { display: flex; }
  .close-modal { align-self: flex-end; background: none; border: none; color: white; font-size: 35px; }
  .modal-media { width: 100%; aspect-ratio: 1; background: #000; border-radius: 20px; margin-bottom: 25px; border: 1px solid #222; position: relative; overflow: hidden; }
  .modal-media img { width: 100%; height: 100%; object-fit: contain; }
  #countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
  .countdown-number { font-family: 'Bebas Neue', sans-serif; font-size: 100px; color: var(--accent); }
  .controls { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
  .btn-action { width: 100%; padding: 15px; border-radius: 12px; border: none; font-family: 'Bebas Neue', sans-serif; font-size: 18px; cursor: pointer; }
  .btn-done { background: var(--accent); color: var(--black); }
  .btn-repos { background: #222; color: white; }
  .btn-repos.active { background: var(--success); }
  .btn-retry { background: transparent; color: var(--gray); border: 1px solid #333; }
  #timer-display { font-family: 'Bebas Neue', sans-serif; color: var(--accent); font-size: 24px; text-align: center; height: 30px; margin-bottom: 10px; }
</style>
</head>
<body>

<header>
  <h1 class="title-main">WORKOUT<br>COACH.</h1>
</header>

<div class="weeks-nav">
  <div class="week-btn active" onclick="showWeek(1)">Sem. 1</div>
  <div class="week-btn" onclick="showWeek(2)">Sem. 2</div>
  <div class="week-btn" onclick="showWeek(3)">Sem. 3</div>
  <div class="week-btn" onclick="showWeek(4)">Sem. 4</div>
</div>

<div id="workout-container"></div>

<div id="modal" class="modal">
  <button class="close-modal" onclick="closeModal()">×</button>
  <div class="modal-media">
    <div id="countdown-overlay"><div class="countdown-number" id="cd-num">7</div></div>
    <div id="m-media"></div>
  </div>
  <h2 id="m-name" style="font-family:'Bebas Neue'; font-size:32px;"></h2>
  <div id="timer-display"></div>
  <p id="m-desc" style="color:var(--gray); font-size:14px; margin-bottom:20px;"></p>
  <div class="controls">
    <button class="btn-action btn-done" onclick="markDone()">VALIDER LA SÉRIE</button>
    <button id="rest-btn" class="btn-action btn-repos" onclick="startRest()">REPOS (60S)</button>
    <button class="btn-action btn-retry" onclick="startPrep(activeId)">REPRENDRE</button>
  </div>
</div>

<script>
const exercises = [
  { id: 'p1', gif: 'img/pompes.svg', name: 'Pompes Genoux', sets: '3 x 10', week: 1, session: 'Bases' },
  { id: 's1', gif: 'img/squat.svg', name: 'Squats', sets: '3 x 15', week: 1, session: 'Bases' },
  { id: 'g1', gif: 'img/planche.svg', name: 'Planche', sets: '3 x 30s', week: 1, session: 'Gainage' },
  { id: 'p2', gif: 'img/pompes.svg', name: 'Pompes Classiques', sets: '3 x 8', week: 2, session: 'Force' },
  { id: 'd2', gif: 'img/dips.svg', name: 'Dips Chaise', sets: '3 x 10', week: 2, session: 'Force' },
  { id: 'f2', gif: 'img/fentes.svg', name: 'Fentes', sets: '3 x 10/j', week: 2, session: 'Jambes' },
  { id: 'p3', gif: 'img/pike.svg', name: 'Pike Pushups', sets: '3 x 8', week: 3, session: 'Epaules' },
  { id: 'po3', gif: 'img/pont.svg', name: 'Pont Fessier', sets: '3 x 20', week: 3, session: 'Postérieur' },
  { id: 'g3', gif: 'img/planche.svg', name: 'Planche', sets: '3 x 45s', week: 3, session: 'Gainage' },
  // SEMAINE 4 : Le Challenge
  { id: 'p4', gif: 'img/pompes.svg', name: 'Pompes (Max)', sets: '3 x AMRAP', week: 4, session: 'Challenge A' },
  { id: 'd4', gif: 'img/dips.svg', name: 'Dips (Max)', sets: '3 x AMRAP', week: 4, session: 'Challenge A' },
  { id: 's4', gif: 'img/squat.svg', name: 'Squat Sauté', sets: '3 x 15', week: 4, session: 'Challenge B' },
  { id: 'g4', gif: 'img/planche.svg', name: 'Planche', sets: '3 x 1min', week: 4, session: 'Challenge B' }
];

let activeId = null;
let restTimer = null;
let state = JSON.parse(localStorage.getItem('calis_v2')) || { done: [] };

function playBip(f, d) {
  const c = new (window.AudioContext || window.webkitAudioContext)();
  const o = c.createOscillator(); const g = c.createGain();
  o.connect(g); g.connect(c.destination); o.frequency.value = f;
  g.gain.setValueAtTime(0.1, c.currentTime); o.start(); o.stop(c.currentTime + d);
}

function render() {
  const container = document.getElementById('workout-container');
  container.innerHTML = '';
  for(let w=1; w<=4; w++) {
    let html = `<div id="week-${w}" class="week-content ${w===1?'active':''}">`;
    let lastS = "";
    exercises.filter(ex => ex.week === w).forEach(ex => {
      if(ex.session !== lastS) { html += `<div class="session-title">${ex.session}</div>`; lastS = ex.session; }
      const isDone = state.done.includes(ex.id) ? 'done' : '';
      html += `<div class="exercise-item ${isDone}" id="item-${ex.id}" onclick="openEx('${ex.id}')">
        <div class="ex-check"></div><div class="ex-info"><div class="ex-name">${ex.name}</div><div class="ex-sets">${ex.sets}</div></div>
      </div>`;
    });
    html += `</div>`; container.innerHTML += html;
  }
}

function openEx(id) {
  activeId = id; playBip(600, 0.1);
  document.getElementById('modal').classList.add('open');
  startPrep(id);
}

function startPrep(id) {
  const ex = exercises.find(e => e.id === id);
  const overlay = document.getElementById('countdown-overlay');
  const cdNum = document.getElementById('cd-num');
  overlay.style.display = 'flex';
  document.getElementById('m-name').textContent = ex.name;
  document.getElementById('m-media').innerHTML = '';
  let c = 7; cdNum.textContent = c;
  const t = setInterval(() => {
    c--; if(c>0) { cdNum.textContent = c; playBip(400, 0.05); }
    else { clearInterval(t); overlay.style.display = 'none'; 
    document.getElementById('m-media').innerHTML = `<img src="${ex.gif}">`; playBip(800, 0.2); }
  }, 1000);
}

function startRest() {
  if(restTimer) clearInterval(restTimer);
  let s = 60; const b = document.getElementById('rest-btn');
  b.classList.add('active');
  restTimer = setInterval(() => {
    s--; document.getElementById('timer-display').textContent = `Repos : ${s}s`;
    if(s<=0) { clearInterval(restTimer); b.classList.remove('active'); playBip(500, 0.5); }
  }, 1000);
}

function markDone() {
  if(!state.done.includes(activeId)) { 
    state.done.push(activeId); localStorage.setItem('calis_v2', JSON.stringify(state));
    document.getElementById(`item-${activeId}`).classList.add('done');
  }
  closeModal();
}

function closeModal() { document.getElementById('modal').classList.remove('open'); clearInterval(restTimer); }
function showWeek(n) {
  document.querySelectorAll('.week-content').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.week-btn').forEach(e => e.classList.remove('active'));
  document.getElementById('week-'+n).classList.add('active');
  document.querySelectorAll('.week-btn')[n-1].classList.add('active');
}
render();
</script>
</body>
</html>
