<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mon Planning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --black: #0a0a0a; --white: #f5f0e8; --accent: #e8ff47; --gray: #888; --card: #141414; --border: #222; --success: #2ecc71; --error: #ff4747; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; padding-bottom: 30px; }
        .progress-fixed { position: fixed; top: 0; left: 0; width: 100%; height: 6px; background: #222; z-index: 1000; }
        #global-bar-fill { width: 0%; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width 0.5s ease; }
        #global-percent { position: fixed; top: 10px; right: 20px; font-family: 'Bebas Neue'; color: var(--accent); font-size: 20px; z-index: 1000; }
        header { padding: 60px 25px 20px; }
        .title-main { font-family: 'Bebas Neue', sans-serif; font-size: 55px; line-height: 0.9; text-transform: uppercase; }
        .planning-card { background: var(--card); border-radius: 20px; padding: 20px; margin: 0 20px 30px; border: 1px solid var(--border); }
        .planning-title { color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 20px; margin-bottom: 15px; }
        .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .day-toggle { width: 42px; height: 38px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: var(--gray); cursor: pointer; }
        .day-toggle.active { background: var(--accent); color: var(--black); border-color: var(--accent); }
        .nav-weeks { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 30px; overflow-x: auto; scrollbar-width: none; }
        .week-btn { padding: 12px 25px; border-radius: 30px; border: 1px solid var(--border); background: #111; color: var(--white); font-weight: bold; white-space: nowrap; }
        .week-btn.active { background: var(--white); color: var(--black); }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gray); margin: 0 25px 15px; text-transform: uppercase; }
        .exercise-list { padding: 0 20px; margin-bottom: 30px; min-height: 50px; }
        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); }
        .card.done { border-color: var(--success); opacity: 0.7; }
        .checkbox { width: 26px; height: 26px; border: 2px solid var(--accent); border-radius: 8px; flex-shrink: 0; }
        .card.done .checkbox { background: var(--success); border-color: var(--success); display: flex; align-items: center; justify-content: center; }
        .card.done .checkbox::after { content: '✓'; color: var(--black); font-weight: bold; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 10000; display: flex; flex-direction: column; padding: 40px 25px; visibility: hidden; opacity: 0; transition: 0.3s; }
        .modal.open { visibility: visible; opacity: 1; }
        .modal-media { width: 100%; aspect-ratio: 1; background: #000; border-radius: 20px; margin-bottom: 20px; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
        #countdown-text { font-family: 'Bebas Neue'; font-size: 120px; color: var(--accent); }
        .btn-action { width: 100%; padding: 20px; border-radius: 15px; border: none; font-family: 'Bebas Neue'; font-size: 22px; margin-bottom: 10px; font-weight: bold; }
        .btn-done { background: var(--accent); color: var(--black); }
        .btn-uncheck { background: var(--error); color: white; }
        .btn-repos { background: #222; color: white; }
    </style>
</head>
<body>
<div class="progress-fixed"><div id="global-bar-fill"></div></div>
<div id="global-percent">0%</div>
<header><h1 class="title-main">MON<br>PLANNING.</h1></header>
<div class="planning-card"><div class="planning-title">JOURS D'ENTRAÎNEMENT</div><div class="days-row" id="day-row"></div></div>
<div class="nav-weeks" id="week-nav"></div>
<div id="weeks-container"></div>
<div id="modal-workout" class="modal">
    <div style="text-align:right; color:white; font-size:40px; margin-bottom:10px" onclick="closeWorkout()">×</div>
    <div class="modal-media"><div id="countdown-text">7</div></div>
    <h2 id="m-name" style="font-family:'Bebas Neue'; font-size:32px; text-align: center; margin-bottom: 10px;"></h2>
    <div id="timer-display" style="text-align:center; color:var(--accent); font-family:'Bebas Neue'; font-size:28px; height:40px;"></div>
    <div style="margin-top:auto;" id="modal-controls"></div>
</div>
