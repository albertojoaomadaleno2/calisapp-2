<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mon Planning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --black: #0a0a0a; --white: #f5f0e8; --accent: #e8ff47; --gray: #888; --card: #141414; --border: #222; --success: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; padding-bottom: 50px; }
        header { padding: 60px 25px 20px; }
        .title-main { font-family: 'Bebas Neue', sans-serif; font-size: 55px; line-height: 0.9; text-transform: uppercase; }
        .planning-card { background: var(--card); border-radius: 20px; padding: 20px; margin: 0 20px 30px; border: 1px solid var(--border); }
        .planning-title { color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 20px; margin-bottom: 15px; }
        .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .day-toggle { width: 40px; height: 35px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: var(--gray); cursor: pointer; }
        .day-toggle.active { background: var(--accent); color: var(--black); border-color: var(--accent); }
        .next-session { font-size: 13px; color: var(--white); border-top: 1px solid #222; padding-top: 15px; }
        .nav-weeks { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 30px; overflow-x: auto; }
        .week-btn { padding: 12px 25px; border-radius: 30px; border: 1px solid var(--border); background: #111; color: var(--white); font-weight: bold; white-space: nowrap; }
        .week-btn.active { background: var(--white); color: var(--black); }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gray); margin: 0 25px 15px; }
        .exercise-list { padding: 0 20px; margin-bottom: 30px; }
        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); }
        .card.done { border-color: var(--success); }
        .checkbox { width: 24px; height: 24px; border: 2px solid var(--accent); border-radius: 6px; }
        .card.done .checkbox { background: var(--success); border-color: var(--success); position: relative; }
        .card.done .checkbox::after { content: '✓'; color: var(--black); position: absolute; left: 4px; top: -2px; font-weight: bold; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 10000; display: none; flex-direction: column; padding: 50px 25px; }
        .modal.open { display: flex; }
        .modal-media { width: 100%; aspect-ratio: 1; background: #000; border-radius: 20px; margin-bottom: 20px; position: relative; overflow: hidden; border: 1px solid var(--border); }
        #countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue'; font-size: 100px; color: var(--accent); }
        .btn-action { width: 100%; padding: 18px; border-radius: 12px; border: none; font-family: 'Bebas Neue'; font-size: 20px; margin-bottom: 10px; }
        .btn-done { background: var(--accent); color: var(--black); }
        .btn-repos { background: #222; color: white; }
    </style>
</head>
<body>
<header><h1 class="title-main">MON<br>PLANNING.</h1></header>
<div class="planning-card">
    <div class="planning-title">JOURS D'ENTRAÎNEMENT</div>
    <div class="days-row" id="day-selector">
        <div class="day-toggle" data-day="0">LUN</div><div class="day-toggle" data-day="1">MAR</div>
        <div class="day-toggle" data-day="2">MER</div><div class="day-toggle" data-day="3">JEU</div>
        <div class="day-toggle" data-day="4">VEN</div><div class="day-toggle" data-day="5">SAM</div>
        <div class="day-toggle" data-day="6">DIM</div>
    </div>
    <div class="next-session">📅 Aujourd'hui : <span id="today-status">Repos</span>.</div>
</div>
<div class="nav-weeks"><div class="week-btn active">Sem. 1</div><div class="week-btn">Sem. 2</div></div>
<div class="section-title">SESSION A</div><div class="exercise-list" id="list-a"></div>
<div class="section-title">SESSION B</div><div class="exercise-list" id="list-b"></div>
<div id="modal-workout" class="modal">
    <div style="align-self:flex-end; color:white; font-size:45px; padding: 10px;" onclick="closeWorkout()">×</div>
    <div class="modal-media"><div id="countdown-overlay">7</div><div id="m-media"></div></div>
    <h2 id="m-name" style="font-family:'Bebas Neue'; font-size:35px; text-align: center; margin-bottom: 10px;"></h2>
    <div id="timer-display" style="text-align:center; color:var(--accent); font-family:'Bebas Neue'; font-size:24px; height:30px; margin-bottom: 20px;"></div>
    <div style="margin-top:auto;"><button class="btn-action btn-done" onclick="markDone()">VALIDER LA SÉRIE</button><button class="btn-action btn-repos" onclick="startRest()">REPOS (60S)</button></div>
</div>
<script>
const dataA = [{id:'sa1',name:'Pompes Genoux',sets:'3x12',gif:'img/pompes.svg'},{id:'sa2',name:'Squats',sets:'3x15',gif:'img/squat.svg'}];
const dataB = [{id:'sb1',name:'Planche',sets:'3x30s',gif:'img/planche.svg'},{id:'sb2',name:'Dips Banc',sets:'3x10',gif:'img/dips.svg'}];
let state = JSON.parse(localStorage.getItem('calis_vFinal')) || {done:[], activeDays:[0,2,4]};
let timerObj = null, activeExId = null;
function bip(f,d){ try{ const ctx=new(window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=f; g.gain.value=0.1; o.start(); o.stop(ctx.currentTime+d); }catch(e){} }
document.querySelectorAll('.day-toggle').forEach(el => {
    const d=parseInt(el.dataset.day); if(state.activeDays.includes(d)) el.classList.add('active');
    el.onclick=()=>{ el.classList.toggle('active'); const i=state.activeDays.indexOf(d); if(i>-1) state.activeDays.splice(i,1); else state.activeDays.push(d); save(); updateStatus(); };
});
function updateStatus(){ const d=(new Date().getDay()+6)%7; document.getElementById('today-status').textContent=state.activeDays.includes(d)?"Entraînement !":"Repos"; }
function render(){
    const draw=(l,c)=>{ document.getElementById(c).innerHTML=l.map(ex=>`<div class="card ${state.done.includes(ex.id)?'done':''}" onclick="openWorkout('${ex.id}')"><div class="checkbox"></div><div class="ex-info"><b>${ex.name}</b><small>${ex.sets}</small></div></div>`).join(''); };
    draw(dataA,'list-a'); draw(dataB,'list-b'); updateStatus();
}
function openWorkout(id){
    activeExId=id; const ex=[...dataA,...dataB].find(e=>e.id===id); document.getElementById('m-name').textContent=ex.name; document.getElementById('m-media').innerHTML=''; document.getElementById('modal-workout').classList.add('open');
    let c=7; const o=document.getElementById('countdown-overlay'); o.style.display='flex'; o.textContent=c; bip(600,0.1);
    timerObj=setInterval(()=>{ c--; o.textContent=c; if(c>0) bip(400,0.05); if(c<=0){ clearInterval(timerObj); o.style.display='none'; document.getElementById('m-media').innerHTML=`<img src="${ex.gif}" style="width:100%;height:100%;object-fit:contain;">`; bip(800,0.2); } },1000);
}
function markDone(){ if(!state.done.includes(activeExId))state.done.push(activeExId); save(); render(); closeWorkout(); }
function startRest(){ clearInterval(timerObj); let s=60; timerObj=setInterval(()=>{ s--; document.getElementById('timer-display').textContent=`REPOS : ${s}s`; if(s<=0){ clearInterval(timerObj); bip(550,0.5); } },1000); }
function closeWorkout(){ clearInterval(timerObj); document.getElementById('modal-workout').classList.remove('open'); document.getElementById('timer-display').textContent=''; }
function save(){ localStorage.setItem('calis_vFinal', JSON.stringify(state)); }
render();
</script>
</body>
</html>
