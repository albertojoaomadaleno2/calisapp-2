<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mon Planning</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --black: #0a0a0a; --white: #f5f0e8; --accent: #e8ff47; --gray: #888; --card: #141414; --border: #222; --success: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--black); color: var(--white); font-family: 'DM Sans', sans-serif; padding-bottom: 30px; overflow-x: hidden; }
        header { padding: 60px 25px 20px; }
        .title-main { font-family: 'Bebas Neue', sans-serif; font-size: 55px; line-height: 0.9; text-transform: uppercase; }
        
        .planning-card { background: var(--card); border-radius: 20px; padding: 20px; margin: 0 20px 30px; border: 1px solid var(--border); }
        .planning-title { color: var(--accent); font-family: 'Bebas Neue', sans-serif; font-size: 20px; margin-bottom: 15px; }
        .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .day-toggle { width: 42px; height: 38px; border-radius: 10px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; color: var(--gray); cursor: pointer; }
        .day-toggle.active { background: var(--accent); color: var(--black); border-color: var(--accent); }
        .status-text { font-size: 14px; border-top: 1px solid #222; padding-top: 15px; display: flex; align-items: center; gap: 8px; }

        .nav-weeks { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 30px; overflow-x: auto; scrollbar-width: none; }
        .nav-weeks::-webkit-scrollbar { display: none; }
        .week-btn { padding: 12px 25px; border-radius: 30px; border: 1px solid var(--border); background: #111; color: var(--white); font-weight: bold; white-space: nowrap; cursor: pointer; }
        .week-btn.active { background: var(--white); color: var(--black); border-color: var(--white); }

        .week-content { display: none; }
        .week-content.active { display: block; }

        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--gray); margin: 0 25px 15px; text-transform: uppercase; }
        .exercise-list { padding: 0 20px; margin-bottom: 30px; }
        
        .card { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); transition: 0.2s; }
        .card.done { border-color: var(--success); opacity: 0.7; }
        .checkbox { width: 26px; height: 26px; border: 2px solid var(--accent); border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .card.done .checkbox { background: var(--success); border-color: var(--success); }
        .card.done .checkbox::after { content: '✓'; color: var(--black); font-weight: bold; }
        .ex-info b { font-size: 17px; display: block; }
        .ex-info small { color: var(--accent); font-weight: bold; font-size: 14px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 10000; display: none; flex-direction: column; padding: 40px 25px; }
        .modal.open { display: flex; }
        .modal-media { width: 100%; aspect-ratio: 1; background: #000; border-radius: 20px; margin-bottom: 20px; position: relative; overflow: hidden; border: 1px solid var(--border); }
        #countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue'; font-size: 100px; color: var(--accent); z-index: 2; }
        .btn-action { width: 100%; padding: 20px; border-radius: 15px; border: none; font-family: 'Bebas Neue'; font-size: 22px; margin-bottom: 10px; font-weight: bold; }
        .btn-done { background: var(--accent); color: var(--black); }
        .btn-repos { background: #222; color: white; }
    </style>
</head>
<body>

<header><h1 class="title-main">MON<br>PLANNING.</h1></header>

<div class="planning-card">
    <div class="planning-title">JOURS D'ENTRAÎNEMENT</div>
    <div class="days-row">
        <div class="day-toggle" data-day="1">LUN</div><div class="day-toggle" data-day="2">MAR</div>
        <div class="day-toggle" data-day="3">MER</div><div class="day-toggle" data-day="4">JEU</div>
        <div class="day-toggle" data-day="5">VEN</div><div class="day-toggle" data-day="6">SAM</div>
        <div class="day-toggle" data-day="0">DIM</div>
    </div>
    <div class="status-text">📅 Aujourd'hui : <span id="today-status">Chargement...</span></div>
</div>

<div class="nav-weeks" id="week-nav">
    <button class="week-btn active" onclick="switchWeek(1)">Sem. 1</button>
    <button class="week-btn" onclick="switchWeek(2)">Sem. 2</button>
    <button class="week-btn" onclick="switchWeek(3)">Sem. 3</button>
    <button class="week-btn" onclick="switchWeek(4)">Sem. 4</button>
</div>

<div id="weeks-container">
    </div>

<div id="modal-workout" class="modal">
    <div style="text-align:right; color:white; font-size:40px; margin-bottom:10px" onclick="closeWorkout()">×</div>
    <div class="modal-media"><div id="countdown-overlay">7</div><div id="m-media"></div></div>
    <h2 id="m-name" style="font-family:'Bebas Neue'; font-size:32px; text-align: center; margin-bottom: 10px;"></h2>
    <div id="timer-display" style="text-align:center; color:var(--accent); font-family:'Bebas Neue'; font-size:28px; height:40px;"></div>
    <div style="margin-top:auto;">
        <button class="btn-action btn-done" onclick="markDone()">VALIDER LA SÉRIE</button>
        <button class="btn-action btn-repos" onclick="startRest()">REPOS (60S)</button>
    </div>
</div>

<script>
const program = {
    1: { A: [{id:'s1a1', n:'Pompes Genoux', s:'3x12'}, {id:'s1a2', n:'Squats', s:'3x15'}], B: [{id:'s1b1', n:'Planche', s:'3x30s'}, {id:'s1b2', n:'Dips Banc', s:'3x10'}] },
    2: { A: [{id:'s2a1', n:'Pompes Classiques', s:'3x10'}, {id:'s2a2', n:'Fentes', s:'3x12'}], B: [{id:'s2b1', n:'Planche Latérale', s:'3x30s'}, {id:'s2b2', n:'Dips Sol', s:'3x12'}] },
    3: { A: [{id:'s3a1', n:'Pompes Diamant', s:'3x8'}, {id:'s3a2', n:'Squat Sauté', s:'3x12'}], B: [{id:'s3b1', n:'Planche Dynamique', s:'3x45s'}, {id:'s3b2', n:'Dips surélevés', s:'3x10'}] },
    4: { A: [{id:'s4a1', n:'Pompes Déclinées', s:'3x10'}, {id:'s4a2', n:'Burpees', s:'3x10'}], B: [{id:'s4b1', n:'Hollow Body', s:'3x30s'}, {id:'s4b2', n:'Dips Max Reps', s:'2xMax'}] }
};

let state = JSON.parse(localStorage.getItem('calis_pro_db')) || { done: [], activeDays: [1, 3, 5], currentWeek: 1 };
let timerObj = null, activeExId = null;

function switchWeek(w) {
    state.currentWeek = w;
    document.querySelectorAll('.week-btn').forEach((btn, i) => btn.classList.toggle('active', i+1 === w));
    render();
    save();
}

function render() {
    const container = document.getElementById('weeks-container');
    const weekData = program[state.currentWeek];
    
    let html = `
        <div class="section-title">SESSION A</div>
        <div class="exercise-list">${weekData.A.map(ex => createCard(ex)).join('')}</div>
        <div class="section-title">SESSION B</div>
        <div class="exercise-list">${weekData.B.map(ex => createCard(ex)).join('')}</div>
    `;
    container.innerHTML = html;
    updateStatus();
}

function createCard(ex) {
    const isDone = state.done.includes(ex.id);
    return `
        <div class="card ${isDone?'done':''}" onclick="openWorkout('${ex.id}', '${ex.n}')">
            <div class="checkbox"></div>
            <div class="ex-info"><b>${ex.n}</b><small>${ex.s}</small></div>
        </div>
    `;
}

function openWorkout(id, name) {
    activeExId = id;
    document.getElementById('m-name').textContent = name;
    document.getElementById('modal-workout').classList.add('open');
    let c = 7; const o = document.getElementById('countdown-overlay');
    o.style.display = 'flex'; o.textContent = c;
    timerObj = setInterval(() => {
        c--; o.textContent = c;
        if(c <= 0) { clearInterval(timerObj); o.style.display = 'none'; }
    }, 1000);
}

function markDone() {
    if(!state.done.includes(activeExId)) state.done.push(activeExId);
    save(); render(); closeWorkout();
}

function startRest() {
    clearInterval(timerObj);
    let s = 60;
    timerObj = setInterval(() => {
        s--; document.getElementById('timer-display').textContent = `REPOS : ${s}s`;
        if(s <= 0) { clearInterval(timerObj); document.getElementById('timer-display').textContent = "GO !"; }
    }, 1000);
}

function closeWorkout() { clearInterval(timerObj); document.getElementById('modal-workout').classList.remove('open'); document.getElementById('timer-display').textContent = ''; }

function updateStatus() {
    const d = new Date().getDay();
    document.getElementById('today-status').textContent = state.activeDays.includes(d) ? "Entraînement !" : "Repos";
    document.querySelectorAll('.day-toggle').forEach(el => {
        const day = parseInt(el.dataset.day);
        el.classList.toggle('active', state.activeDays.includes(day));
        el.onclick = (e) => {
            e.stopPropagation();
            if(state.activeDays.includes(day)) state.activeDays = state.activeDays.filter(x => x !== day);
            else state.activeDays.push(day);
            save(); updateStatus();
        };
    });
}

function save() { localStorage.setItem('calis_pro_db', JSON.stringify(state)); }

render();
</script>
</body>
</html>
